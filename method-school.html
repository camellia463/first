<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习方法超市</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #fff5f7 0%, #ffeef2 50%, #fff0f5 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 樱花飘落动画 */
        .sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .sakura {
            position: absolute;
            color: #ffb7c5;
            font-size: 20px;
            opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* 顶部导航 */
        .header {
            background: linear-gradient(135deg, #ff9aaf 0%, #ff6b8a 100%);
            color: white;
            padding: 20px 40px;
            box-shadow: 0 2px 8px rgba(255, 107, 138, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* 分类标签栏 */
        .category-bar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 16px 40px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(255, 107, 138, 0.1);
            position: sticky;
            top: 88px;
            z-index: 99;
        }

        .category-btn {
            padding: 8px 20px;
            border: 1px solid #d9e8ff;
            border-radius: 20px;
            background: white;
            color: #666;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .category-btn:hover {
            border-color: #ff6b8a;
            color: #ff6b8a;
            background: #fff5f7;
        }

        .category-btn.active {
            background: linear-gradient(135deg, #ff9aaf 0%, #ff6b8a 100%);
            color: white;
            border-color: #ff6b8a;
        }

        .category-btn[data-category="memory"] { border-left: 3px solid #ff6b6b; }
        .category-btn[data-category="output"] { border-left: 3px solid #51cf66; }
        .category-btn[data-category="note"] { border-left: 3px solid #fcc419; }
        .category-btn[data-category="goal"] { border-left: 3px solid #845ef7; }
        .category-btn[data-category="cognition"] { border-left: 3px solid #22b8cf; }
        .category-btn[data-category="focus"] { border-left: 3px solid #f06595; }
        .category-btn[data-category="reading"] { border-left: 3px solid #20c997; }

        /* 主内容区 */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 40px;
            position: relative;
            z-index: 1;
        }

        .method-count {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .method-count span {
            color: #1890ff;
            font-weight: 600;
        }

        /* 卡片网格 */
        .method-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        /* 方法卡片 */
        .method-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(255, 107, 138, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 182, 193, 0.3);
        }

        .method-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(255, 107, 138, 0.25);
            border-color: #91d5ff;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .card-icon.memory { background: linear-gradient(135deg, #fff0f0 0%, #ffdbdb 100%); }
        .card-icon.output { background: linear-gradient(135deg, #f0fff0 0%, #dbf2d8 100%); }
        .card-icon.note { background: linear-gradient(135deg, #fff8e0 0%, #fff0c0 100%); }
        .card-icon.goal { background: linear-gradient(135deg, #f0f0ff 0%, #d8d8f5 100%); }
        .card-icon.cognition { background: linear-gradient(135deg, #e0f7ff 0%, #c0f0ff 100%); }
        .card-icon.focus { background: linear-gradient(135deg, #ffe0f0 0%, #ffd0e8 100%); }
        .card-icon.reading { background: linear-gradient(135deg, #e0fff0 0%, #c0ffe8 100%); }

        .card-tag {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            background: #fff0f5;
            color: #ff6b8a;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .card-en {
            font-size: 12px;
            color: #999;
            margin-bottom: 12px;
        }

        .card-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #f0f5ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .card-tier {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
        }

        .card-tier.tier-t1 {
            background: #d9f7be;
            color: #52c41a;
        }

        .card-tier.tier-t2 {
            background: #ffe58f;
            color: #fa8c16;
        }

        .card-tier.tier-t3 {
            background: #ffccc7;
            color: #ff4d4f;
        }

        .card-level {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .level-high {
            background: #fff2e8;
            color: #fa541c;
        }

        .level-mid {
            background: #fffbe6;
            color: #faad14;
        }

        .level-low {
            background: #f6ffed;
            color: #52c41a;
        }

        /* 进度条 */
        .card-progress {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: #f0f0f0;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #ff9aaf 0%, #ff6b8a 100%);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 11px;
            color: #999;
            min-width: 32px;
            text-align: right;
        }

        /* 已掌握状态 */
        .card-mastered {
            background: linear-gradient(135deg, #f6ffed 0%, #d9f7be 100%);
            border: 1px solid #b7eb8f;
        }

        .card-mastered .card-level {
            background: #52c41a;
            color: white;
        }

        .card-arrow {
            color: #ccc;
            font-size: 18px;
            transition: transform 0.3s;
        }

        .method-card:hover .card-arrow {
            transform: translateX(4px);
            color: #ff6b8a;
        }

        .method-card.card-mastered {
            border: 2px solid #52c41a;
            background: linear-gradient(135deg, #f6ffed 0%, #e8f8e8 100%);
        }

        /* 详情弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 20px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            padding: 30px 30px 20px;
            background: linear-gradient(135deg, #ff9aaf 0%, #ff6b8a 100%);
            color: white;
            border-radius: 20px 20px 0 0;
        }

        .modal-header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .modal-en {
            font-size: 14px;
            opacity: 0.85;
        }

        .modal-tag {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 12px;
        }

        .modal-body {
            padding: 30px;
        }

        .modal-section {
            margin-bottom: 24px;
        }

        .modal-section:last-child {
            margin-bottom: 0;
        }

        .modal-section-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-section-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: #ff6b8a;
            border-radius: 2px;
        }

        .modal-section p {
            font-size: 15px;
            color: #444;
            line-height: 1.8;
        }

        .modal-section ul {
            list-style: none;
            padding: 0;
        }

        .modal-section li {
            font-size: 14px;
            color: #444;
            line-height: 1.8;
            padding: 8px 0;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .modal-section li::before {
            content: '•';
            color: #1890ff;
            font-weight: bold;
        }

        .modal-steps {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-step {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            background: #f8fbff;
            border-radius: 10px;
            align-items: flex-start;
        }

        .step-num {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #ff9aaf 0%, #ff6b8a 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .step-content {
            font-size: 14px;
            color: #333;
            line-height: 1.6;
            flex: 1;
        }

        /* 步骤勾选 */
        .step-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid #d9d9d9;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            font-size: 14px;
            color: white;
        }

        .step-checkbox:hover {
            border-color: #ff6b8a;
        }

        .step-checkbox.checked {
            background: linear-gradient(135deg, #ff9aaf 0%, #ff6b8a 100%);
            border-color: #ff6b8a;
        }

        .modal-step.checked {
            background: #fff5f7;
        }

        .modal-step.checked .step-content {
            color: #999;
            text-decoration: line-through;
        }

        /* 掌握状态 */
        .mastered-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: linear-gradient(135deg, #52c41a 0%, #73d13d 100%);
            color: white;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-header h4 {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-header h4::before {
            content: '';
            width: 4px;
            height: 16px;
            background: #ff6b8a;
            border-radius: 2px;
        }

        .progress-info {
            font-size: 13px;
            color: #666;
        }

        .progress-info span {
            color: #52c41a;
            font-weight: 600;
        }

        .long-desc p {
            font-size: 14px;
            color: #444;
            line-height: 1.8;
            margin-bottom: 12px;
        }

        .long-desc p:last-child {
            margin-bottom: 0;
        }

        .why-category {
            display: flex;
            gap: 12px;
            background: linear-gradient(135deg, #fff7e6 0%, #fff2d6 100%);
            border-radius: 10px;
            padding: 14px 16px;
            border-left: 4px solid #fa8c16;
        }

        .why-category-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        .why-category-title {
            font-size: 13px;
            font-weight: 600;
            color: #fa8c16;
            margin-bottom: 4px;
        }

        .why-category-text p {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            margin: 0;
        }

        .tier-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f5ff;
        }

        .tier-badge {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .tier-t1 {
            background: linear-gradient(135deg, #52c41a 0%, #73d13d 100%);
            color: white;
        }

        .tier-t2 {
            background: linear-gradient(135deg, #fa8c16 0%, #ffc53d 100%);
            color: white;
        }

        .tier-t3 {
            background: linear-gradient(135deg, #ff4d4f 0%, #ff7875 100%);
            color: white;
        }

        .tier-desc {
            font-size: 13px;
            color: #666;
        }

        .modal-tip {
            background: linear-gradient(135deg, #f0f5ff 0%, #e8f4ff 100%);
            border-radius: 10px;
            padding: 16px;
            border-left: 4px solid #ff6b8a;
        }

        .modal-tip-title {
            font-size: 13px;
            font-weight: 600;
            color: #ff6b8a;
            margin-bottom: 6px;
        }

        .modal-tip p {
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }

        /* 可视化区域 */
        .visual-section {
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(135deg, #fff7e6 0%, #fff3d9 100%);
            border-radius: 16px;
            border: 1px solid #ffd591;
        }

        .visual-title {
            font-size: 14px;
            font-weight: 600;
            color: #fa8c16;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 流程图样式 */
        .flowchart {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px 0;
        }

        .flow-node {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .flow-num {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #1890ff 0%, #096dd9 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .flow-text {
            font-size: 14px;
            color: #333;
            padding: 8px 14px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e8f4ff;
            flex: 1;
        }

        .flow-arrow {
            text-align: center;
            color: #ccc;
            font-size: 16px;
            padding: 4px 0;
        }

        /* 树状图样式 */
        .tree-diagram {
            padding: 10px 0;
        }

        .tree-root {
            text-align: center;
            padding: 12px 20px;
            background: linear-gradient(135deg, #1890ff 0%, #096dd9 100%);
            color: white;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            display: inline-block;
        }

        .tree-branches {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .tree-branch {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .tree-connector {
            width: 2px;
            height: 16px;
            background: #ccc;
        }

        .tree-leaf {
            padding: 8px 14px;
            background: white;
            border: 2px solid #1890ff;
            border-radius: 8px;
            font-size: 13px;
            color: #333;
            text-align: center;
            min-width: 80px;
        }

        /* 网状图样式 */
        .network-diagram {
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .network-center {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1890ff 0%, #096dd9 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: 600;
            position: relative;
            z-index: 2;
            box-shadow: 0 4px 12px rgba(24, 144, 255, 0.3);
        }

        .network-nodes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .network-node {
            position: absolute;
            width: 44px;
            height: 44px;
            background: white;
            border: 2px solid #22b8cf;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* 对比图样式 */
        .compare-diagram {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 16px;
            align-items: center;
            padding: 10px 0;
        }

        .compare-box {
            padding: 14px;
            border-radius: 10px;
            text-align: center;
        }

        .compare-box.good {
            background: linear-gradient(135deg, #f6ffed 0%, #e8f8e8 100%);
            border: 2px solid #52c41a;
        }

        .compare-box.bad {
            background: linear-gradient(135deg, #fff2e8 0%, #ffe7d6 100%);
            border: 2px solid #ff4d4f;
        }

        .compare-label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .compare-box.good .compare-label { color: #52c41a; }
        .compare-box.bad .compare-label { color: #ff4d4f; }

        .compare-text {
            font-size: 13px;
            color: #333;
            line-height: 1.5;
        }

        .compare-arrow {
            font-size: 24px;
            color: #999;
        }

        /* 平衡图样式 */
        .balance-diagram {
            padding: 20px;
            text-align: center;
        }

        .balance-scale {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .balance-top {
            display: flex;
            gap: 40px;
            align-items: flex-end;
        }

        .balance-pan {
            width: 70px;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
        }

        .balance-pan.low {
            background: #fff2e8;
            border: 2px solid #ffa940;
        }

        .balance-pan.right {
            background: #f6ffed;
            border: 2px solid #52c41a;
        }

        .balance-pan.high {
            background: #fff1f0;
            border: 2px solid #ff4d4f;
        }

        .balance-stand {
            width: 4px;
            height: 30px;
            background: #ccc;
        }

        .balance-base {
            width: 80px;
            height: 8px;
            background: #ccc;
            border-radius: 4px;
        }

        /* 图像示例样式 */
        .image-example {
            background: white;
            border: 1px solid #e8f4ff;
            border-radius: 10px;
            padding: 14px;
            margin-top: 12px;
        }

        .image-example-title {
            font-size: 12px;
            color: #1890ff;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .image-example-content {
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }

        .mind-path {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px;
            background: #f8fbff;
            border-radius: 8px;
            font-size: 13px;
        }

        .mind-path .node {
            padding: 6px 12px;
            background: white;
            border: 1px solid #1890ff;
            border-radius: 6px;
            color: #333;
        }

        .mind-path .arrow {
            color: #1890ff;
            font-weight: bold;
        }

        .modal-footer {
            padding: 20px 30px;

        // 渲染卡片
        function renderCards(category = 'all') {
            const grid = document.getElementById('method-grid');
            const filtered = category === 'all' ? methods : methods.filter(m => m.category === category);
            document.getElementById('total-count').textContent = filtered.length;

            grid.innerHTML = filtered.map(m => {
                const progress = getMethodProgress(m.id);
                const totalSteps = m.steps.length;
                const completedSteps = progress.length;
                const percent = totalSteps > 0 ? (completedSteps / totalSteps * 100) : 0;
                const isMastered = completedSteps === totalSteps;

                return `
                <div class="method-card ${isMastered ? 'card-mastered' : ''}" onclick="openModal(${m.id})">
                    <div class="card-header">
                        <div class="card-icon ${m.category}">${m.icon}</div>
                        <span class="card-tag">${m.tag}</span>
                    </div>
                    <h3 class="card-title">${m.name}</h3>
                    <p class="card-en">${m.en}</p>
                    <p class="card-desc">${m.shortDesc}</p>
                    <div class="card-progress">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${percent}%"></div>
                        </div>
                        <span class="progress-text">${completedSteps}/${totalSteps}</span>
                    </div>
                    <div class="card-footer">
                        <div class="card-tags">
                            <span class="card-tier tier-${m.tier.toLowerCase()}">${m.tier} ${m.tierText}</span>
                            <span class="card-level ${m.levelClass}">${isMastered ? '已掌握 ✓' : m.level}</span>
                        </div>
                        <span class="card-arrow">→</span>
                    </div>
                </div>
            `}).join('');
        }

        // 获取方法进度
        function getMethodProgress(methodId) {
            const allProgress = JSON.parse(localStorage.getItem('methodProgress') || '{}');
            return allProgress[methodId] || [];
        }

        // 保存方法进度
        function saveMethodProgress(methodId, completedSteps) {
            const allProgress = JSON.parse(localStorage.getItem('methodProgress') || '{}');
            allProgress[methodId] = completedSteps;
            localStorage.setItem('methodProgress', JSON.stringify(allProgress));
        }

        // 切换步骤完成状态
        function toggleStep(methodId, stepIndex) {
            const completed = getMethodProgress(methodId);
            const idx = completed.indexOf(stepIndex);

            if (idx > -1) {
                completed.splice(idx, 1);
            } else {
                completed.push(stepIndex);
            }

            completed.sort((a, b) => a - b);
            saveMethodProgress(methodId, completed);
            updateModalSteps(methodId);
            renderCards();
        }

        // 更新弹窗中的步骤显示
        function updateModalSteps(methodId) {
            const m = methods.find(x => x.id === methodId);
            const completed = getMethodProgress(methodId);
            const isMastered = completed.length === m.steps.length;

            // 更新步骤勾选状态
            document.querySelectorAll('.modal-step').forEach((el, i) => {
                const isChecked = completed.includes(i);
                el.classList.toggle('checked', isChecked);
                el.querySelector('.step-checkbox').classList.toggle('checked', isChecked);
                el.querySelector('.step-checkbox').textContent = isChecked ? '✓' : '';
            });

            // 更新进度显示
            const progressText = document.querySelector('.modal-progress-text');
            if (progressText) {
                progressText.innerHTML = `已完成 <span>${completed.length}/${m.steps.length}</span> 步${isMastered ? ' — <span style="color:#52c41a">🎉 已掌握！</span>' : ''}`;
            }

            // 如果全部完成，更新头部标签
            const modalTag = document.getElementById('modal-tag');
            if (isMastered) {
                modalTag.innerHTML = '🎉 已掌握';
                modalTag.style.background = 'rgba(82, 196, 26, 0.3)';
            }
        }

        // 打开弹窗
        function openModal(id) {
            const m = methods.find(x => x.id === id);
            const completed = getMethodProgress(id);
            const isMastered = completed.length === m.steps.length;

            document.getElementById('modal-title').textContent = m.name;
            document.getElementById('modal-en').textContent = m.en;
            document.getElementById('modal-tag').textContent = isMastered ? '🎉 已掌握' : m.tag;
            if (isMastered) {
                document.getElementById('modal-tag').style.background = 'rgba(82, 196, 26, 0.3)';
            } else {
                document.getElementById('modal-tag').style.background = 'rgba(255, 255, 255, 0.2)';
            }
            document.getElementById('modal-level').textContent = `难度：${m.level}`;

            document.getElementById('modal-body').innerHTML = `
                <div class="modal-section">
                    <h4 class="modal-section-title">详细介绍</h4>
                    <div class="long-desc">${(m.longDesc || m.desc).split('\n').map(p => p.trim()).filter(p => p).map(p => `<p>${p}</p>`).join('')}</div>
                </div>
                <div class="modal-section">
                    <div class="why-category">
                        <span class="why-category-icon">📌</span>
                        <div class="why-category-text">
                            <div class="why-category-title">为什么在${m.tag}</div>
                            <p>${m.whyCategory}</p>
                        </div>
                    </div>
                </div>
                <div class="modal-section">
                    <div class="tier-info">
                        <span class="tier-badge tier-${m.tier.toLowerCase()}">${m.tier}</span>
                        <span class="tier-desc">${m.tierText} · ${m.level}</span>
                    </div>
                </div>
                <div class="modal-section">
                    <div class="progress-header">
                        <h4>操作步骤</h4>
                        <div class="progress-info modal-progress-text">
                            已完成 <span>${completed.length}/${m.steps.length}</span> 步${isMastered ? ' — <span style="color:#52c41a">🎉 已掌握！</span>' : ''}
                        </div>
                    </div>
                    <div class="modal-steps">
                        ${m.steps.map((s, i) => {
                            const isChecked = completed.includes(i);
                            return `
                            <div class="modal-step ${isChecked ? 'checked' : ''}" onclick="toggleStep(${id}, ${i})">
                                <div class="step-checkbox ${isChecked ? 'checked' : ''}" onclick="event.stopPropagation(); toggleStep(${id}, ${i})">
                                    ${isChecked ? '✓' : ''}
                                </div>
                                <span class="step-num">${i + 1}</span>
                                <span class="step-content">${s}</span>
                            </div>
                        `}).join('')}
                    </div>
                </div>
                ${m.visual ? `
                <div class="visual-section">
                    <div class="visual-title">🧩 思维可视化</div>
                    ${renderVisual(m.visual)}
                </div>
                ` : ''}
                ${m.imageExample ? `
                <div class="image-example">
                    <div class="image-example-title">📖 举个例子</div>
                    <div class="image-example-content">${m.imageExample}</div>
                </div>
                ` : ''}
                <div class="modal-section">
                    <div class="modal-tip">
                        <div class="modal-tip-title">💡 小贴士</div>
                        <p>${m.tips}</p>
                    </div>
                </div>
            `;

            document.getElementById('modal').classList.add('active');
        }

        // 渲染可视化图
        function renderVisual(visual) {
            if (!visual) return '';

            switch(visual.type) {
                case 'flowchart':
                    return `
                        <div class="flowchart">
                            ${visual.nodes.map((node, i) => `
                                ${i > 0 ? '<div class="flow-arrow">↓</div>' : ''}
                                <div class="flow-node">
                                    <span class="flow-num">${i + 1}</span>
                                    <span class="flow-text">${node}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;

                case 'tree':
                    return `
                        <div class="tree-diagram">
                            <div class="tree-root">${visual.root}</div>
                            <div class="tree-branches">
                                ${visual.branches.map(branch => `
                                    <div class="tree-branch">
                                        <div class="tree-connector"></div>
                                        <div class="tree-leaf">${branch}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;

                case 'network':
                    return `
                        <div class="network-diagram" style="position:relative;width:200px;height:200px;margin:0 auto;">
                            <div class="network-center">${visual.center}</div>
                            ${visual.nodes.map((node, i) => {
                                const angle = (i / visual.nodes.length) * 2 * Math.PI;
                                const radius = 70;
                                const x = 100 + radius * Math.cos(angle) - 22;
                                const y = 100 + radius * Math.sin(angle) - 22;
                                return `<div class="network-node" style="position:absolute;left:${x}px;top:${y}px;">${node.icon}</div>`;
                            }).join('')}
                        </div>
                    `;

                case 'compare':
                    return `
                        <div class="compare-diagram">
                            <div class="compare-box bad">
                                <div class="compare-label">${visual.badLabel}</div>
                                <div class="compare-text">${visual.bad}</div>
                            </div>
                            <div class="compare-arrow">→</div>
                            <div class="compare-box good">
                                <div class="compare-label">${visual.goodLabel}</div>
                                <div class="compare-text">${visual.good}</div>
                            </div>
                        </div>
                    `;

                case 'balance':
                    return `
                        <div class="balance-diagram">
                            <div class="balance-scale">
                                <div class="balance-top">
                                    <div class="balance-pan ${visual.left.level}">
                                        <div>${visual.left.label}</div>
                                        <small>${visual.left.desc}</small>
                                    </div>
                                    <div class="balance-pan ${visual.right.level}">
                                        <div>${visual.right.label}</div>
                                        <small>${visual.right.desc}</small>
                                    </div>
                                </div>
                                <div class="balance-stand"></div>
                                <div class="balance-base"></div>
                            </div>
                        </div>
                    `;

                case 'path':
                    return `
                        <div class="mind-path">
                            ${visual.nodes.map((node, i) => `
                                <span class="node">${node}</span>
                                ${i < visual.nodes.length - 1 ? '<span class="arrow">→</span>' : ''}
                            `).join('')}
                        </div>
                    `;

                default:
                    return '';
            }
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // 点击遮罩关闭
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ESC键关闭
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // 分类切换
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderCards(this.dataset.category);
            });
        });

        // 初始化
        renderCards();

        // 樱花飘落动画
        function createSakura() {
            const container = document.getElementById('sakura-container');
            const sakuraChars = ['❀', '✿', '❁', '✾', '💮', '🏵️', '🌸'];

            for (let i = 0; i < 15; i++) {
                const sakura = document.createElement('div');
                sakura.className = 'sakura';
                sakura.textContent = sakuraChars[Math.floor(Math.random() * sakuraChars.length)];
                sakura.style.left = Math.random() * 100 + 'vw';
                sakura.style.fontSize = (Math.random() * 15 + 12) + 'px';
                sakura.style.animationDuration = (Math.random() * 8 + 8) + 's';
                sakura.style.animationDelay = (Math.random() * 10) + 's';
                container.appendChild(sakura);
            }
        }
        createSakura();
    </script>
