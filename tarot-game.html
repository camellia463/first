<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TY 塔罗 · 星月夜</title>
<style>
:root{
--night0:#070B24;--night1:#0B1033;--night2:#0E1540;--night3:#111A44;--night4:#0A0E20;
--star:#F5D56C;--star2:#E8C44A;--star3:#D4A832;--star4:#FFFAE8;
--sw1:#476B96;--sw2:#5B7FAA;--sw3:#6B8FB8;--sw4:#7BA1C7;--sw5:#8BA2C8;--sw6:#97B5D2;--sw7:#A8C0DE;
--sakura:#F2A3B9;--sakura2:#E8879D;--sakura3:#FAD4E0;
--surf:#121A38;--cardbg:#151E40;--bdr:#222C52;--bdr2:#2E3A64;
--t1:#E2E0EC;--t2:#B8B5CC;--t3:#7A779A;
--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:#0E1220;color:var(--t1);min-height:100vh;overflow-x:hidden}

/* === SKY === */
.sky-svg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
@keyframes swirlRot{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes swirlRotR{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
@keyframes starPulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes starPulse2{0%,100%{opacity:.4}33%{opacity:.9}66%{opacity:.55}}
@keyframes moonBreathe{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:.95;transform:scale(1.04)}}
@keyframes villageDrift{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.sw0{animation:swirlRotR 50s linear infinite;transform-origin:380px 180px;opacity:.9}
.sw1{animation:swirlRot 38s linear infinite;transform-origin:640px 120px;opacity:.8}
.sw2{animation:swirlRotR 60s linear infinite;transform-origin:190px 330px;opacity:.75}
.sw3{animation:swirlRot 44s linear infinite;transform-origin:710px 370px;opacity:.7}
.sw4{animation:swirlRotR 52s linear infinite;transform-origin:290px 220px;opacity:.65}
.st0{animation:starPulse 3.5s ease-in-out infinite}
.st1{animation:starPulse2 5s ease-in-out infinite}
.st2{animation:starPulse 4s ease-in-out infinite 1.2s}
.st3{animation:starPulse2 6s ease-in-out infinite .7s}
.st4{animation:starPulse 4.5s ease-in-out infinite 2s}
.mn{animation:moonBreathe 8s ease-in-out infinite}
.vlg{animation:villageDrift 30s ease-in-out infinite}
/* Shooting stars - CSS based, actually moves */
.shooting-star{position:fixed;pointer-events:none;z-index:0;height:4px;border-radius:2px;
background:linear-gradient(90deg,transparent 0%,#FFFDF5 15%,#F5D56C 50%,transparent 100%);
animation:shoot 5s ease-in infinite;opacity:0;box-shadow:0 0 14px 4px rgba(245,213,108,.6)}
.shooting-star::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);
width:8px;height:8px;background:#FFFDF5;border-radius:50%;box-shadow:0 0 20px 6px #F5D56C}
.ss2{animation-duration:5.5s;animation-delay:.8s;height:3px;width:120px;top:15%}
.ss3{animation-duration:4.8s;animation-delay:1.8s;height:5px;width:160px;top:22%}
.ss4{animation-duration:6s;animation-delay:2.8s;height:3px;width:130px;top:5%}
.ss5{animation-duration:5.2s;animation-delay:3.5s;height:4px;width:140px;top:18%}
.ss6{animation-duration:5.8s;animation-delay:.3s;height:6px;width:180px;top:12%}
.ss7{animation-duration:6.2s;animation-delay:4.2s;height:3px;width:110px;top:28%}
@keyframes shoot{
0%{left:-200px;opacity:0;width:80px}
4%{opacity:1;width:160px}
12%{left:110vw;opacity:.5;width:40px}
13%{left:110vw;opacity:0;width:0}
100%{left:110vw;opacity:0;width:0}
}

/* === SAKURA === */
.petals{position:fixed;inset:0;pointer-events:none;z-index:2;display:none}
.petals.on{display:block}
.petal{position:absolute;animation:petalFall linear infinite}
@keyframes petalFall{
0%{transform:translate(0,0) rotate(0deg);opacity:0}
3%{opacity:.8}
80%{opacity:.4}
100%{transform:translate(30px,100vh) rotate(360deg);opacity:0}
}

/* === PETAL BURST === */
.petal-burst{position:fixed;pointer-events:none;z-index:100;animation:burst .9s ease-out forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--bx),var(--by)) scale(.2)}}

/* === APP === */
.app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:36px 20px 80px}
h1{font-size:26px;font-weight:600;color:var(--star);text-align:center;letter-spacing:-.5px;margin-bottom:4px}
.tagline{font-size:12px;color:var(--t3);text-align:center;letter-spacing:1.5px;margin-bottom:32px}

/* Step indicator */
.steps-row{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:36px}
.step-dot{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--surf);border:2px solid var(--bdr2);color:var(--t3);font-size:13px;font-weight:600;transition:all .35s;position:relative}
.step-dot.act{background:var(--star2);border-color:var(--star);color:#1A1A20;box-shadow:0 0 16px rgba(245,213,108,.25)}
.step-dot.done{background:rgba(245,213,108,.12);border-color:var(--star3);color:var(--star)}
.step-line{width:48px;height:2px;background:var(--bdr2);transition:all .35s}
.step-line.done{background:var(--star3)}
.step-label-row{display:flex;justify-content:center;gap:84px;margin-top:-28px;margin-bottom:28px}
.step-label-row span{font-size:10px;color:var(--t3);width:36px;text-align:center;transition:.35s}
.step-label-row span.act{color:var(--star);font-weight:500}

/* Step panels */
.step-panel{display:none;animation:fadeIn .4s ease}
.step-panel.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.step-title{font-size:15px;font-weight:500;color:var(--t1);margin-bottom:16px;text-align:center}
.step-sub{font-size:11px;color:var(--t3);text-align:center;margin-bottom:6px}

/* Domain */
.domains{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.dt{padding:6px 15px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--bdr2);background:var(--surf);color:var(--t2);transition:all .2s;user-select:none}
.dt:hover{border-color:var(--sakura2);color:var(--sakura)}
.dt.on{background:rgba(242,163,185,.12);border-color:var(--sakura);color:var(--sakura);font-weight:500}

/* Question */
.qbox{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;padding:18px 22px;margin-bottom:14px}
.qbox textarea{width:100%;background:var(--night1);border:1px solid var(--bdr2);border-radius:12px;color:var(--t1);font-size:13px;font-family:var(--font);padding:12px 14px;resize:none;outline:none;transition:border .2s;min-height:60px}
.qbox textarea:focus{border-color:var(--sakura2)}
.qbox textarea::placeholder{color:var(--t3)}
.tog{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:11px;color:var(--t2)}
.tog-sw{position:relative;width:36px;height:20px;cursor:pointer}
.tog-sw input{display:none}
.tog-sl{position:absolute;inset:0;background:var(--bdr2);border-radius:10px;transition:.25s}
.tog-sl::before{content:'';position:absolute;width:16px;height:16px;left:2px;top:2px;background:var(--t2);border-radius:50%;transition:.25s}
input:checked+.tog-sl{background:var(--sakura)}
input:checked+.tog-sl::before{transform:translateX(16px)}

/* Spreads */
.spreads{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:12px 0;max-height:400px;overflow-y:auto;padding-right:4px}
.spreads::-webkit-scrollbar{width:4px}
.spreads::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}
.sp{padding:10px 12px;border-radius:12px;border:1px solid var(--bdr2);background:var(--surf);cursor:pointer;transition:.2s;text-align:center}
.sp:hover{border-color:var(--sw3)}
.sp.on{border-color:var(--star);background:rgba(245,213,108,.06)}
.sp .sn{font-size:12px;font-weight:500;color:var(--t1)}
.sp .sm{font-size:10px;color:var(--t3);margin-top:1px}

/* Buttons */
.btn-row{text-align:center;margin:18px 0}
#shuffleBtn{display:inline-flex;gap:8px;padding:13px 38px;background:var(--star2);border:none;border-radius:40px;color:#1A1A20;font-size:14px;font-weight:600;cursor:pointer;transition:.25s;font-family:var(--font)}
#shuffleBtn:hover{background:var(--star);transform:translateY(-1px);box-shadow:0 4px 20px rgba(245,213,108,.3)}
#shuffleBtn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

/* Nav */
.nav-row{display:flex;justify-content:center;gap:12px;margin-top:18px}
.nav-btn{padding:11px 28px;border-radius:40px;font-size:13px;font-weight:500;cursor:pointer;transition:.25s;font-family:var(--font);border:none}
.nav-next{background:var(--star2);color:#1A1A20}
.nav-next:hover{background:var(--star);transform:translateY(-1px);box-shadow:0 4px 20px rgba(245,213,108,.3)}
.nav-back{background:var(--surf);border:1px solid var(--bdr2);color:var(--t2)}
.nav-back:hover{border-color:var(--t3);color:var(--t1)}
.nav-next:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

/* Step 4 Q&A */
.qa-wrap{display:flex;flex-direction:column;gap:14px}
.qa-list{display:flex;flex-direction:column;gap:12px;max-height:360px;overflow-y:auto;padding-right:4px}
.qa-list::-webkit-scrollbar{width:4px}
.qa-list::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}
.qa-q{font-size:12px;color:var(--star);background:rgba(245,213,108,.06);border-radius:12px 12px 4px 12px;padding:12px 16px;align-self:flex-end;max-width:85%;line-height:1.6;border:1px solid rgba(245,213,108,.1)}
.qa-a{font-size:13px;line-height:1.9;background:var(--surf);border:1px solid var(--bdr2);border-radius:12px 12px 12px 4px;padding:16px 20px;align-self:flex-start;max-width:95%}
.qa-a b{color:var(--sakura)}
.qa-input-row{display:flex;gap:8px;margin-top:8px}
.qa-input{flex:1;background:var(--night1);border:1px solid var(--bdr2);border-radius:24px;color:var(--t1);font-size:13px;font-family:var(--font);padding:12px 18px;outline:none;transition:border .2s}
.qa-input:focus{border-color:var(--sakura2)}
.qa-input::placeholder{color:var(--t3)}
.qa-send{padding:11px 22px;border-radius:24px;font-size:13px;font-weight:500;cursor:pointer;transition:.25s;font-family:var(--font);border:none;background:var(--star2);color:#1A1A20;white-space:nowrap}
.qa-send:hover{background:var(--star)}
.qa-send:disabled{opacity:.35;cursor:not-allowed}
.qa-empty{text-align:center;font-size:12px;color:var(--t3);padding:24px 0;line-height:1.8}
.qa-minicards{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.qa-mc{font-size:10px;padding:3px 8px;border-radius:8px;background:var(--surf);border:1px solid var(--bdr2);color:var(--t2)}

/* Pick area */
.pick-area{display:none;margin:20px 0}
.pick-area.on{display:block}
.pick-hint{text-align:center;font-size:13px;color:var(--star);margin-bottom:8px}
.pick-prog{text-align:center;font-size:11px;color:var(--t3);margin-bottom:16px}
.cards-spread{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;perspective:1200px}
.cards-spread.celtic{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:560px;margin:0 auto}
.cards-spread.celtic .cs:nth-child(1){grid-column:2;grid-row:1}
.cards-spread.celtic .cs:nth-child(2){grid-column:2;grid-row:2}
.cards-spread.celtic .cs:nth-child(3){grid-column:3;grid-row:1}
.cards-spread.celtic .cs:nth-child(4){grid-column:3;grid-row:2}
.cards-spread.celtic .cs:nth-child(5){grid-column:1;grid-row:1/3}
.cards-spread.celtic .cs:nth-child(6){grid-column:4;grid-row:1/3}
.cards-spread.celtic .cs:nth-child(7){grid-column:1/3;grid-row:3}
.cards-spread.celtic .cs:nth-child(8){grid-column:1/3;grid-row:4}
.cards-spread.celtic .cs:nth-child(9){grid-column:3/5;grid-row:3}
.cards-spread.celtic .cs:nth-child(10){grid-column:3/5;grid-row:4}

/* Card */
.cs{display:flex;flex-direction:column;align-items:center;gap:4px}
.cw{width:106px;height:162px;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,0,.2,1)}
.cw:not(.fl):not(.pk):hover{transform:translateY(-5px)}
.cw.fl{transform:rotateY(180deg)}
.cw.pk{pointer-events:none}
.cf{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;overflow:hidden}
.cb{background:linear-gradient(150deg,#0D1130 0%,#111B3D 50%,#0A0E28 100%);border:2px solid var(--bdr2);display:flex;align-items:center;justify-content:center;position:relative;border-radius:10px;overflow:hidden}
.cb .cbsvg{position:absolute;inset:0;pointer-events:none;border-radius:10px;width:100%;height:100%}
.cb .cbn{position:absolute;bottom:14px;font-size:9px;color:rgba(245,213,108,.5);letter-spacing:1px;z-index:1;font-weight:500}
.cfr{transform:rotateY(180deg);display:flex;flex-direction:column;padding:9px;background:linear-gradient(160deg,#151230 0%,#0E0C28 40%,#131035 100%);border:1.5px solid;box-shadow:0 2px 8px rgba(0,0,0,.2);position:relative;border-radius:10px;overflow:hidden;width:100%;height:100%}
.cfr .cfbg{position:absolute;inset:0;pointer-events:none;border-radius:10px;width:100%;height:100%}
.cfr .cft{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
.cfr .pos{font-size:8px;font-weight:500;text-align:center;margin-bottom:2px;letter-spacing:.3px}
.cfr .name{font-size:11px;font-weight:600;text-align:center;margin-bottom:1px;line-height:1.2}
.cfr .en{font-size:7px;text-align:center;margin-bottom:3px;opacity:.65}
.cfr .sym{text-align:center;font-size:16px;margin:3px 0;text-shadow:0 0 8px currentColor}
.cfr .kw{font-size:8px;text-align:center;line-height:1.3;color:var(--t2);margin-top:auto}
.cfr .badge{margin-top:4px;text-align:center;font-size:7px;padding:1px 7px;border-radius:8px;align-self:center;z-index:1}
.pl{font-size:8px;color:var(--sakura);max-width:106px;text-align:center;line-height:1.2;word-break:break-all}

/* Result */
.result{display:none;margin-top:28px}
.result.on{display:block}
.ip{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;overflow:hidden;margin-top:24px}
.iph{background:rgba(242,163,185,.06);padding:14px 22px;border-bottom:1px solid var(--bdr2)}
.iph h3{font-size:14px;font-weight:500;color:var(--sakura)}
.ipb{padding:22px}
.sec{margin-bottom:20px}.sec:last-child{margin-bottom:0}
.sec h4{font-size:11px;font-weight:600;color:var(--sakura2);letter-spacing:1.5px;margin-bottom:10px;text-transform:uppercase}
.narr{font-size:13px;line-height:2.1;background:rgba(245,213,108,.04);border-radius:12px;padding:18px 22px;margin-bottom:18px;border:1px solid var(--bdr2)}
.obox{background:rgba(242,163,185,.06);border-left:3px solid var(--sakura);border-radius:8px;padding:12px 16px;margin:12px 0}
.obox p{font-size:12px;line-height:1.8}
.obox p+p{margin-top:8px}
.abox{background:rgba(123,161,199,.06);border-left:3px solid var(--sw3);border-radius:8px;padding:12px 16px}
.abox p{font-size:12px;line-height:1.8}
.clist{display:flex;flex-direction:column;gap:10px}
.ci{background:var(--night1);border-radius:12px;padding:12px 14px;border:1px solid var(--bdr2)}
.ci .ct{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ci .cnn{font-size:12px;font-weight:500}
.ci .cpos{font-size:9px;color:var(--t3)}
.ci .cd{font-size:11px;line-height:1.7;color:var(--t2)}

/* History */
.hist{margin-top:44px;padding-top:22px;border-top:1px solid var(--bdr2)}
.hist h4{font-size:10px;color:var(--t3);letter-spacing:1px;margin-bottom:10px}
.hg{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.hi{padding:8px;border-radius:8px;background:var(--surf);border:1px solid var(--bdr2);text-align:center;cursor:pointer;transition:.2s}
.hi:hover{border-color:var(--sakura2)}
.hi .hd{font-size:10px;margin-bottom:1px}
.hi .ht{font-size:8px;color:var(--t3)}
</style>
</head>
<body>

<svg class="sky-svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="skybg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#030618"/>
<stop offset="8%" stop-color="#080D26"/>
<stop offset="20%" stop-color="#0C1340"/>
<stop offset="35%" stop-color="#162060"/>
<stop offset="48%" stop-color="#1A1A68"/>
<stop offset="58%" stop-color="#1E1660"/>
<stop offset="70%" stop-color="#1A1848"/>
<stop offset="82%" stop-color="#181E38"/>
<stop offset="92%" stop-color="#141A2C"/>
<stop offset="100%" stop-color="#0E1220"/>
</linearGradient>
<linearGradient id="skybg2" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#301C50" stop-opacity=".35"/>
<stop offset="35%" stop-color="#1A1040" stop-opacity=".1"/>
<stop offset="60%" stop-color="#0F1535" stop-opacity="0"/>
<stop offset="80%" stop-color="#181030" stop-opacity=".25"/>
<stop offset="100%" stop-color="#0A0A1C" stop-opacity=".5"/>
</linearGradient>

<stop offset="70%" stop-color="transparent"/>
<stop offset="100%" stop-color="#1A0A15" stop-opacity=".3"/>
</linearGradient>
<radialGradient id="sglow"><stop offset="0%" stop-color="#FFFDF5" stop-opacity="1"/><stop offset="18%" stop-color="#F5D56C" stop-opacity=".7"/><stop offset="100%" stop-color="#F5D56C" stop-opacity="0"/></radialGradient>
<radialGradient id="sglow2"><stop offset="0%" stop-color="#FFFDF5" stop-opacity=".9"/><stop offset="30%" stop-color="#E8C44A" stop-opacity=".45"/><stop offset="100%" stop-color="#E8C44A" stop-opacity="0"/></radialGradient>
<radialGradient id="moongl"><stop offset="0%" stop-color="#FFFDF5" stop-opacity=".9"/><stop offset="15%" stop-color="#F5D56C" stop-opacity=".45"/><stop offset="50%" stop-color="#F5D56C" stop-opacity=".06"/><stop offset="100%" stop-color="#F5D56C" stop-opacity="0"/></radialGradient>
<linearGradient id="shootG1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFDF5" stop-opacity="1"/><stop offset="30%" stop-color="#F5D56C" stop-opacity=".8"/><stop offset="100%" stop-color="#F5D56C" stop-opacity="0"/></linearGradient>
</defs>

<rect width="800" height="900" fill="url(#skybg)"/>
<rect width="800" height="900" fill="url(#skybg2)"/>
<rect width="800" height="900" fill="url(#skybg3)"/>

<g class="mn"><circle cx="65" cy="60" r="80" fill="url(#moongl)"/><circle cx="65" cy="60" r="22" fill="#FFFDF5" opacity=".5"/></g>

<g class="st0"><circle cx="155" cy="48" r="32" fill="url(#sglow)"/><circle cx="155" cy="48" r="3.5" fill="#FFFDF5" opacity=".9"/></g>
<g class="st1"><circle cx="280" cy="72" r="40" fill="url(#sglow)"/><circle cx="280" cy="72" r="4" fill="#FFFDF5" opacity=".95"/></g>
<g class="st2"><circle cx="420" cy="42" r="36" fill="url(#sglow)"/><circle cx="420" cy="42" r="3.5" fill="#FFFDF5" opacity=".9"/></g>
<g class="st3"><circle cx="560" cy="88" r="28" fill="url(#sglow2)"/><circle cx="560" cy="88" r="2.5" fill="#FFFDF5" opacity=".75"/></g>
<g class="st4"><circle cx="700" cy="52" r="34" fill="url(#sglow2)"/><circle cx="700" cy="52" r="3" fill="#FFFDF5" opacity=".85"/></g>
<g class="st1"><circle cx="195" cy="150" r="24" fill="url(#sglow2)"/><circle cx="195" cy="150" r="2" fill="#FFFDF5" opacity=".6"/></g>
<g class="st2"><circle cx="615" cy="170" r="26" fill="url(#sglow2)"/><circle cx="615" cy="170" r="2" fill="#FFFDF5" opacity=".65"/></g>
<g class="st0"><circle cx="345" cy="190" r="22" fill="url(#sglow2)"/><circle cx="345" cy="190" r="1.5" fill="#FFFDF5" opacity=".5"/></g>

function shuffleDeck(arr){
let a=[...arr];for(let pass=0;pass<3;pass++){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
// random cut like physical deck
const cut=Math.floor(Math.random()*a.length*0.6)+Math.floor(a.length*0.2);
a=[...a.slice(cut),...a.slice(0,cut)];
return a;
}

const s=SPREADS.find(x=>x.id===spread);qText=document.getElementById('q').value.trim();
let d=[...DECK];if(useRev)d=[...d,...DECK.map(c=>({...c,rev:true}))];

function cardFaceSVG(c,i){
let cl=c.c||'#E8C44A',ac='#F5D56C',uid='fc'+i+'_'+(c.cn2||c.cn||'').replace(/[^a-zA-Z0-9]/g,'');
let stars='',path='',geo='';
let seed=(i+1)*137;let rng=(n)=>{seed=(seed*16807+0)%2147483647;return (seed%100)/100;};
// Scattered stars - more and brighter
for(let j=0;j<16;j++){
let sx=4+rng()*80,sy=4+rng()*136,sz=.6+rng()*2.4;
stars+=`<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${sz.toFixed(1)}" fill="${j<4?ac:cl}" opacity="${(.25+rng()*.5).toFixed(2)}"/>`;
}
// Central swirl art
let cx=44,cy=50;
path+=`<path d="M${cx-22},${cy-4} Q${cx-6},${cy-22} ${cx+6},${cy-10} Q${cx+20},${cy+4} ${cx+2},${cy+18} Q${cx-16},${cy+24} ${cx-24},${cy+2}" fill="none" stroke="${ac}" stroke-width="1.3" opacity=".35"/>`;
path+=`<path d="M${cx-14},${cy+6} Q${cx-2},${cy-12} ${cx+12},${cy+2} Q${cx+2},${cy+14} ${cx-10},${cy+16}" fill="none" stroke="${cl}" stroke-width=".8" opacity=".28"/>`;
path+=`<path d="M${cx-8},${cy-2} Q${cx+4},${cy-8} ${cx+6},${cy+4} Q${cx},${cy+10} ${cx-6},${cy+8}" fill="none" stroke="${ac}" stroke-width=".5" opacity=".18"/>`;
// Elemental motif
let w=c.wx||'';
if(w==='火'){for(let j=0;j<3;j++){let ax=32+j*12;geo+=`<path d="M${ax},68 Q${ax-2},58 ${ax},50 Q${ax+2},58 ${ax},68" fill="none" stroke="${cl}" stroke-width=".6" opacity=".2"/>`;}}
if(w==='水'){for(let j=0;j<3;j++){let ay=60+j*8;geo+=`<path d="M28,${ay} Q36,${ay-4} 44,${ay} Q52,${ay+4} 60,${ay}" fill="none" stroke="${cl}" stroke-width=".5" opacity=".18"/>`;}}
if(w==='风'){for(let j=0;j<3;j++){let ay=58+j*10;geo+=`<path d="M28,${ay} Q36,${ay-5} 44,${ay+2} Q52,${ay-3} 60,${ay}" fill="none" stroke="${cl}" stroke-width=".5" opacity=".18"/>`;}}
if(w==='土'){for(let j=0;j<3;j++){let ax=30+j*12;geo+=`<rect x="${ax}" y="58" width="8" height="6" rx="1" fill="none" stroke="${cl}" stroke-width=".5" opacity=".15"/>`;}}
return `<svg class="cfbg" viewBox="0 0 88 144" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
<defs>
<radialGradient id="g_${uid}"><stop offset="0%" stop-color="${ac}" stop-opacity=".22"/><stop offset="40%" stop-color="${cl}" stop-opacity=".1"/><stop offset="100%" stop-color="${cl}" stop-opacity="0"/></radialGradient>
<linearGradient id="gb_${uid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${ac}" stop-opacity=".04"/><stop offset="100%" stop-color="${cl}" stop-opacity=".12"/></linearGradient>
</defs>
<rect width="88" height="144" fill="url(#gb_${uid})"/>
<rect width="88" height="144" fill="url(#g_${uid})"/>
<rect x="2" y="2" width="84" height="140" rx="5" fill="none" stroke="${ac}" stroke-width="1.2" opacity=".5" stroke-dasharray="3 4"/>
<rect x="5" y="5" width="78" height="134" rx="4" fill="none" stroke="${cl}" stroke-width=".7" opacity=".32"/>
<circle cx="4" cy="4" r="3" fill="${ac}" opacity=".7"/><circle cx="84" cy="4" r="3" fill="${ac}" opacity=".7"/>
<circle cx="4" cy="140" r="3" fill="${ac}" opacity=".7"/><circle cx="84" cy="140" r="3" fill="${ac}" opacity=".7"/>
<ellipse cx="44" cy="46" rx="30" ry="20" fill="url(#g_${uid})"/>
${path}${geo}${stars}
<circle cx="44" cy="48" r="17" fill="none" stroke="${ac}" stroke-width="1" opacity=".4"/>
<circle cx="44" cy="48" r="13" fill="none" stroke="${cl}" stroke-width=".7" opacity=".25" stroke-dasharray="2 3"/>
<circle cx="44" cy="48" r="6" fill="${ac}" opacity=".2"/>
</svg>`;
}
function cardBackSVG(i){
let seed=i*137;let rng=(n)=>{seed=(seed*16807+0)%2147483647;return (seed%100)/100;};
let uid='cb'+i,cl1='#F5D56C',cl2='#E8C44A',cl3='#FFFDF5',cl4='#7BA1C7',cl5='#5B7FAA';
let lines=[],cx=44,cy=72;
// Dense spiral vortex - many thin arcs
for(let layer=0;layer<8;layer++){
let lr=8+layer*6,lt=3.5+layer*.4,lo=.06+layer*.025,lw=.3+layer*.15,cl=layer%2?cl2:cl1;
lines.push(`<path d="M${cx},${cy} ${Array.from({length:40},(_,t)=>{
let tt=t/39*lt*Math.PI*2,rr=lr+tt*2.5,th=tt+layer*.7;
return`L${(cx+Math.cos(th)*rr).toFixed(1)},${(cy+Math.sin(th)*rr*1.3).toFixed(1)}`}).join(' ')}" fill="none" stroke="${cl}" stroke-width="${lw}" opacity="${lo.toFixed(2)}" stroke-linecap="round"/>`);
}
// Intersecting angular lines - geometric abstract
for(let j=0;j<14;j++){
let x1=2+rng()*84,y1=2+rng()*140,x2=2+rng()*84,y2=2+rng()*140;
let cl=j%3?cl5:cl4;
lines.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${cl}" stroke-width="${(.4+rng()*.8).toFixed(1)}" opacity="${(.08+rng()*.18).toFixed(2)}"/>`);
}
// Concentric rings
for(let r=12;r<=56;r+=8){
lines.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${r%16?cl2:cl1}" stroke-width="${r<32?.5:.3}" opacity="${(.04+r/300).toFixed(2)}" stroke-dasharray="${r%12?2:4} ${r%10?3:2}"/>`);
}
// Horizontal/vertical wave lines
let waves='';
for(let row=0;row<6;row++){
let by=16+row*22,amp=3+rng()*5,freq=.06+rng()*.08;
waves+=`M2,${by} `;
for(let x=2;x<=86;x+=2)waves+=`L${x},${(by+Math.sin(x*freq+row*2)*amp).toFixed(1)} `;
}
lines.push(`<path d="${waves}" fill="none" stroke="${cl4}" stroke-width=".4" opacity=".15"/>`);
// Few sparse bright dots (not stars, just accents)
let dots='';
for(let j=0;j<8;j++){
dots+=`<circle cx="${(4+rng()*80).toFixed(1)}" cy="${(4+rng()*136).toFixed(1)}" r="${(.3+rng()*1).toFixed(1)}" fill="${j<3?cl3:cl1}" opacity="${(.15+rng()*.35).toFixed(2)}"/>`;
}
// Central focal point
let focus=`<circle cx="${cx}" cy="${cy}" r="2" fill="${cl3}" opacity=".4"/><circle cx="${cx}" cy="${cy}" r="5" fill="none" stroke="${cl1}" stroke-width=".4" opacity=".25"/>`;
return `<svg class="cfbg" viewBox="0 0 88 144" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
<defs><radialGradient id="cbg_${uid}"><stop offset="0%" stop-color="#1A2050" stop-opacity=".25"/><stop offset="70%" stop-color="#0D1130" stop-opacity="0"/></radialGradient></defs>
<rect width="88" height="144" fill="url(#cbg_${uid})"/>
<rect x="2" y="2" width="84" height="140" rx="5" fill="none" stroke="${cl2}" stroke-width=".8" opacity=".25" stroke-dasharray="3 4"/>
${lines.join('')}${dots}${focus}
<circle cx="4" cy="4" r="1.5" fill="${cl1}" opacity=".4"/><circle cx="84" cy="4" r="1.5" fill="${cl1}" opacity=".4"/>
<circle cx="4" cy="140" r="1.5" fill="${cl1}" opacity=".4"/><circle cx="84" cy="140" r="1.5" fill="${cl1}" opacity=".4"/>
</svg>`;
}
function renderPick(s){
const el=document.getElementById('cardsSpread');if(!el)return;
el.innerHTML=pCards.map((c,i)=>{
if(c){let fsvg=cardFaceSVG(c,i);return`<div class="cs"><div class="cw fl pk"><div class="cf cb">${cardBackSVG(i)}<div class="cbn">${i+1}</div></div><div class="cf cfr" style="border-color:${c.c||'var(--star)'}">${fsvg}<div class="cft"><div class="pos" style="color:${c.c||'var(--star)'}">${s.p[i]||''}</div><div class="name" style="color:${c.tc||'var(--star)'}">${c.cn2||c.cn}</div><div class="en" style="color:${c.c||'var(--t3)'}">${c.rev?'▼ ':''}${c.en2||c.en}</div><div class="sym" style="color:${c.c||'var(--star)'}">${c.s||''}</div><div class="kw">${c.rev?'逆：'+c.kw:c.kw}</div><div class="badge" style="background:${(c.c||'var(--star)')+'18'};color:${c.c||'var(--star)'}">${c.arc}阿尔卡纳${c.suit?'·'+c.suit.nm+'组':''}</div></div></div></div><div class="pl">${s.p[i]||''}</div></div>`;}
return`<div class="cs"><div class="cw" onclick="pick(${i},event)"><div class="cf cb">${cardBackSVG(i)}<div class="cbn">${i+1}</div></div></div><div class="pl">${s.p[i]||''}</div></div>`;
}).join('');
}

function pick(i,ev){
if(pCards[i]!==null)return;
const c=pool.shift();if(!c)return;
pCards[i]=c;pOrder.push(i);rem--;
burst(ev.clientX,ev.clientY,8);
const s=SPREADS.find(x=>x.id===spread);renderPick(s);
const prog=document.getElementById('pickProg');if(prog)prog.textContent=rem>0?`还剩 ${rem} 张`:'全部翻开 ✨';
if(rem===0){
document.getElementById('result').classList.add('on');
interpret();
document.getElementById('shuffleBtn').disabled=false;document.getElementById('shuffleBtn').textContent='✦ 重新洗牌';
hist.unshift({t:new Date().toLocaleString(),d:domain,s:spread,cs:pCards.map(c=>({n:c.cn2||c.cn,a:c.arc,r:c.rev})),q:qText||'无'});
if(hist.length>30)hist.pop();renderHist();
goStep3();
}
}

:{t:'?',desc:'未知',adv:'保持平衡，灵活应变。'};

function cardStory(c,i,s){
let p=s.p[i],cn=c.cn2||c.cn,rev=c.rev,arc=c.arc;
let lines=[];
if(arc==='大'){
lines.push(`「${cn}」出现在「${p}」的位置，这是命运的直接介入。`);
if(rev)lines.push(`逆位提示：这张大牌的正面力量被阻碍或内化——不是坏事，而是需要你用不同的方式去理解它。`);
else lines.push(`正位：大阿卡纳以完整姿态降临，它的教义正在你的生命中展开。`);
}else{
let wd=elmNature(c.wx);

function deepAnalyze(q,cards,s,dn){

let lines=[];

// Check question intent
let isWhy=ql.includes('为什么')||ql.includes('原因')||ql.includes('怎么会');
let isHow=ql.includes('怎么')||ql.includes('如何')||ql.includes('应该')||ql.includes('怎么办');
let isWhat=ql.includes('什么')||ql.includes('意思')||ql.includes('含义');
let isLink=ql.includes('联系')||ql.includes('关系')||ql.includes('之间');
let isFuture=ql.includes('未来')||ql.includes('结果')||ql.includes('走向');
let isMe=ql.includes('我')||ql.includes('自己');
let isCard=ql.includes('牌')||ql.includes('这张');

// Find relevant cards
let qKWs=[];
['恋人','爱情','感情','分手','复合','桃花'].forEach(w=>{if(ql.includes(w))qKWs.push('love');});
['工作','事业','职场','创业','晋升','跳槽'].forEach(w=>{if(ql.includes(w))qKWs.push('career');});
['钱','财','富','收入','投资','理财'].forEach(w=>{if(ql.includes(w))qKWs.push('wealth');});
['健康','身体','病','累','失眠','压力'].forEach(w=>{if(ql.includes(w))qKWs.push('health');});
['命运','灵性','前世','灵魂','使命'].forEach(w=>{if(ql.includes(w))qKWs.push('spirit');});

// Score each card's relevance to the question
let scored=cards.map((c,i)=>{
let score=0;
let cn=c.cn2||c.cn,en=c.en2||c.en,kw=c.kw||'',d=c.d||'';
// Keyword match
if(ql.includes(cn)||(en&&ql.toLowerCase().includes(en.toLowerCase())))score+=10;
qKWs.forEach(k=>{
if(k==='love'&&['圣杯','恋人','皇后','星星'].some(w=>cn.includes(w)))score+=5;
if(k==='career'&&['权杖','魔术师','战车','皇帝'].some(w=>cn.includes(w)))score+=5;
if(k==='wealth'&&['星币','皇帝','世界'].some(w=>cn.includes(w)))score+=5;
if(k==='health'&&['节制','力量','星星','月亮'].some(w=>cn.includes(w)))score+=5;
if(k==='spirit'&&['女祭司','隐士','审判','月亮','星星'].some(w=>cn.includes(w)))score+=5;
});
// Position relevance
if(isWhy&&i<3)score+=3;
if(isFuture&&i>=s.n-2)score+=3;
// Major arcana boost
if(c.arc==='大')score+=2;
if(c.rev)score+=1;

return {...c,idx:i,score};
}).sort((a,b)=>b.score-a.score);

// Build narrative
let top3=scored.filter(x=>x.score>0).slice(0,3);
if(top3.length===0)top3=scored.slice(0,3);

// Intro
if(isCard){
lines.push(`<b>关于这张牌</b><br><br>你问了牌面本身。让我从你在「${s.name}」阵中翻开的牌里深度挖掘：`);
}else if(isWhy){
lines.push(`<b>为什么会是这样？</b><br><br>你问"为什么"——这是最有力量的问题。每一张牌的出现都有它的原因。从你在「${s.name}」阵中翻开的<span style="color:var(--star)">${cards.length}</span>张牌里，我拆给你看：`);
}else if(isHow){
lines.push(`<b>怎么走下一步？</b><br><br>牌不是告诉你命运——是告诉你手里有什么牌，然后你自己打。从你的「${s.name}」来看：`);
}else if(isLink){
lines.push(`<b>牌与牌之间的联系</b><br><br>这${cards.length}张牌不是孤立的——它们之间在对话。我帮你串起来：`);
}else if(isFuture){
lines.push(`<b>未来的走向</b><br><br>牌阵的最后几张是时间线上的箭头。基于你现在翻开的牌：`);
}else{
lines.push(`<b>关于你的问题</b><br><br>基于你在「${s.name}」阵中翻开的${cards.length}张牌，我做一个精准的切入：`);
}

lines.push('');

// Analyze top relevant cards
top3.forEach((c,i)=>{
let cn=c.cn2||c.cn,pos=s.p[c.idx]||'',rev=c.rev,arc=c.arc;
let prefix=i===0?'🔮':i===1?'📜':'✨';
lines.push(`${prefix} <b style="color:${c.c||'var(--star)'}">「${cn}」${rev?'▼':''}</b> — 落在「${pos}」的位置`);
lines.push(`位置含义：${pos}${rev?'（逆位：能量内转或受阻）':'（正位：能量顺畅表达）'}`);
lines.push(`牌在告诉你：${rev?'逆位提示——'+c.d:c.d}`);
if(arc==='大')lines.push(`这是大阿卡纳——命运级的信号。别忽略。`);
else{
let wd=elmNature(c.wx);
lines.push(`属于${wd.t}元素——处理的是日常中${wd.desc}的层面。`);
}
lines.push('');
});

// Element interplay
let el={};
cards.forEach(c=>{el[c.wx]=(el[c.wx]||0)+1;});
let domEl=Object.entries(el).sort((a,b)=>b[1]-a[1])[0]?.[0]||'?';
let enat=elmNature(domEl);
lines.push(`<b>元素视角</b><br>牌阵主导元素是${domEl}（${enat.desc}）。${enat.adv}`);

// Synthesis answer
lines.push('');
if(isWhy){
lines.push(`<b>所以，为什么会是这样？</b><br>${top3[0]?(top3[0].cn2||top3[0].cn):'牌面'}的出现不是偶然。它在「${top3[0]?cards[top3[0].idx]?s.p[top3[0].idx]:'':''}」的位置，意味着${top3[0]?cards[top3[0].idx]?(cards[top3[0].idx].rev?'你需要向内看——答案不在外面，在被你忽略的深处。':'这件事的发生有它的必然性。牌在说：注意这个信号，它在帮你校准方向。'):'':''}`);
}else if(isHow){
lines.push(`<b>行动的精髓</b><br>${isMe?`牌阵在对你说话——不是对别人。${enat.adv}。具体到你的问题：第一步，看着「${top3[0]?(top3[0].cn2||top3[0].cn):'牌面'}」给的方向；第二步，信任${cards.some(c=>c.arc==='大')?'大牌的力度':'你日常的直觉'}。`:'牌不说话，牌只照亮。下一步已经在光里了——你需要的是迈出去。'}`);
}else if(isLink){
let conns=[];
for(let i=0;i<Math.min(3,top3.length-1);i++){
conns.push(`「${top3[i].cn2||top3[i].cn}」→「${top3[i+1].cn2||top3[i+1].cn}」：${top3[i].wx===top3[i+1].wx?'同一元素流动，能量在递进':'元素转换——从'+top3[i].wx+'到'+top3[i+1].wx+'，议题在升级'}`);
}
lines.push(`<b>牌的对话</b><br>${conns.join('<br>')}`);
}else{
lines.push(`<b>TA想对你说的</b><br>${cards.filter(c=>c.arc==='大').length>0?'命运在写你的下一章。':''} 这几张牌合在一起说的是：<span style="color:var(--star)">${top3.map(c=>c.cn2||c.cn).join(' → ')}</span>。这就是你此刻需要的答案。`);
}

lines.push('');
lines.push(`<span style="font-size:11px;color:var(--t3)">—— 基于「${s.name}」·${dn}领域 · ${cards.length}张牌的精准解读</span>`);

return lines.join('<br>');
}

</script>
<script>
// ============ ORGANIC SWIRL GENERATOR ============
function genSwirlHTML(cx,cy,maxR,turns,arms,strips,colors){
let paths=[];
for(let arm=0;arm<arms;arm++){
let baseAngle=(arm/arms)*Math.PI*2;
for(let s=0;s<strips;s++){
let t=s/strips;
let r=maxR*(.15+t*.85);
let angle=baseAngle+t*turns*Math.PI*2;
// Add organic wobble
let wo=r*.06*(Math.sin(t*20+arm*3)+Math.cos(t*17+arm*5))*.5;
let wa=angle+(Math.sin(t*14+arm*7)+Math.cos(t*11+arm*3))*15*Math.PI/180;
let rr=r+wo;
// Stroke length
let dl=r*.15*(.7+Math.random()*.6);
let da=.15+Math.random()*.3;
let a1=wa,x1=cx+Math.cos(a1)*rr,y1=cy-Math.sin(a1)*rr;
let a2=wa+da,x2=cx+Math.cos(a2)*(rr+dl*.3),y2=cy-Math.sin(a2)*(rr+dl*.3);
let ax=cx+Math.cos(wa+da*.5)*(rr+dl*.1),ay=cy-Math.sin(wa+da*.5)*(rr+dl*.1);
let w=.8+Math.random()*2.5;
let op=.4+Math.random()*.5;
let clr=colors[Math.floor(Math.random()*colors.length)];
paths.push(`<path d="M${x1.toFixed(1)},${y1.toFixed(1)} Q${ax.toFixed(1)},${ay.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}" fill="none" stroke="${clr}" stroke-width="${w.toFixed(1)}" stroke-linecap="round" opacity="${op.toFixed(2)}"/>`);
}
}
return paths.join('\n');
}

const C2=['#1565C0','#1976D2','#42A5F5','#64B5F6','#0277BD','#0288D1','#039BE5','#4FC3F7','#26C6DA','#BBDEFB'];
const C3=['#1A237E','#283593','#3949AB','#5C6BC0','#29B6F6','#4FC3F7','#81D4FA','#00ACC1'];

let sw0=document.querySelector('.sw0');if(sw0)sw0.innerHTML=genSwirlHTML(380,180,120,3.5,6,60,C1);

let sw2=document.querySelector('.sw2');if(sw2)sw2.innerHTML=genSwirlHTML(190,330,65,2.5,4,30,C3);

let sw4=document.querySelector('.sw4');if(sw4)sw4.innerHTML=genSwirlHTML(290,210,45,2.5,3,25,C2)+genSwirlHTML(530,280,40,2,3,22,C3);

domTags();spreadBtns();
showPanel(1);updateDots(1);
